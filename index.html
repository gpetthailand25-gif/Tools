<style>
/* Layout: ซ้ายเป็นเมนู (PC/iPad แนวนอน) / เมนูล่าง (มือถือ) · ตารางการ์ดกล่องอุปกรณ์ · ฟอร์มยืม-คืนเป็น sheet */
:root{

  --shadow:0 1px 2px rgba(20,30,28,.08),0 10px 30px rgba(20,30,28,.12);
  --scrim:rgba(10,16,14,.55);color-scheme:light;
  --font:"IBM Plex Sans Thai","Noto Sans Thai","Sarabun",system-ui,-apple-system,"Segoe UI",sans-serif;

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.5);--scrim:rgba(0,0,0,.65);color-scheme:dark}}

*{box-sizing:border-box}

img{max-width:100%}

body{background:var(--bg);color:var(--fg);font:400 16px/1.55 var(--font);-webkit-text-size-adjust:100%}

button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.mono{font-family:var(--mono)}

.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.me{display:flex;align-items:center;gap:10px;min-height:44px;padding:4px 14px 4px 6px;border:1px solid var(--line);background:var(--surface);border-radius:99px;max-width:55%}
.me .av{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;flex:none}
.me span{min-width:0;text-align:left;line-height:1.2}
.me b{display:block;font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me small{color:var(--muted);font-size:.75rem}

.shell{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;padding-bottom:104px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:4px;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}

.nav .cnt{position:absolute;top:2px;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--out);color:var(--bg);font:700 11px/18px var(--font);text-align:center}
@media (min-width:900px){
  .shell{grid-template-columns:210px minmax(0,1fr);padding-bottom:48px;align-items:start}

}
main{min-width:0;display:flex;flex-direction:column;gap:16px}

.btn{min-height:46px;padding:0 18px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:.98rem;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}

.kit.is-out{background:linear-gradient(0deg,var(--surface),var(--surface)) padding-box;border-color:var(--out)}
.kit-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.code{font:600 .8rem var(--mono);letter-spacing:.06em;padding:3px 8px;border:1px dashed var(--muted);border-radius:4px;color:var(--muted);text-transform:uppercase}

.kit-a{margin-top:auto;padding-top:10px;display:flex}

.pill.free,.pill.okp{background:var(--ok-soft);color:var(--ok)}
.pill.out{background:var(--out-soft);color:var(--out)}
.pill.badp{background:var(--bad-soft);color:var(--bad)}

.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 14px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
.row.click{cursor:pointer;width:100%;text-align:left}
.row .l{min-width:0;flex:1 1 200px;display:flex;flex-direction:column;gap:2px}

.row .r{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card{padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;gap:12px}

.sect{display:flex;flex-direction:column;gap:10px}
.sect-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.filters{display:flex;flex-wrap:wrap;gap:10px}
.filters select{min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);flex:1 1 160px;min-width:0}

.ov{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:700px;max-height:94vh;max-height:94dvh;display:flex;flex-direction:column;border-radius:16px 16px 0 0;box-shadow:var(--shadow)}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 10px 10px 18px;border-bottom:1px solid var(--line)}
.sh-body{overflow:auto;padding:16px 18px;flex:1;min-height:0;display:flex;flex-direction:column;gap:18px;-webkit-overflow-scrolling:touch}
.sh-foot{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.sh-foot .note{flex:1 1 100%;font-size:.9rem}
.sh-foot .btn{flex:1 1 140px}

.note.warn{color:var(--out);font-weight:600}
.note.good{color:var(--ok);font-weight:600}
.note.err{color:var(--bad);font-weight:600}

.sum{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.95rem}
.sum dt{color:var(--muted)}.sum dd{margin:0;overflow-wrap:anywhere}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.sec-h h3{font-size:1rem}
.prog{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-bottom:10px}
.prog i{display:block;height:100%;background:var(--accent);transition:width .15s}
.chks{display:flex;flex-direction:column;gap:8px}
.chk{position:relative;display:flex;align-items:center;gap:14px;min-height:54px;padding:8px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;user-select:none}
.chk.on{background:var(--accent-soft);border-color:var(--accent)}
.chk input{position:absolute;opacity:0;width:1px;height:1px}
.chk .box{width:30px;height:30px;border-radius:7px;border:2px solid var(--muted);display:grid;place-items:center;flex:none;color:var(--accent-fg)}
.chk .box svg{opacity:0}
.chk input:checked + .box{background:var(--accent);border-color:var(--accent)}
.chk input:checked + .box svg{opacity:1}
.chk input:focus-visible + .box{outline:3px solid var(--accent);outline-offset:2px}
.chk .nm{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:500}
.tag{font:600 .72rem var(--font);padding:2px 8px;border-radius:99px;background:var(--bad-soft);color:var(--bad);white-space:nowrap}

.phs{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.th{position:relative;aspect-ratio:1;max-width:100%;border-radius:8px;overflow:hidden;background:var(--surface2);border:1px solid var(--line);padding:0;display:block}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th .st{position:absolute;inset:0;display:grid;place-items:center;background:var(--scrim);color:#fff;font-size:.8rem;font-weight:600;text-align:center;padding:4px}
.th .rm{position:absolute;top:4px;right:4px;width:30px;height:30px;border-radius:50%;border:0;background:var(--scrim);color:#fff;display:grid;place-items:center;padding:0}
.th .rm svg{width:16px;height:16px}
.pbtns{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:10px}
.pbtns input{position:absolute;opacity:0;width:1px;height:1px}
.hint{font-size:.85rem;color:var(--muted)}

.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font-weight:600;font-size:.92rem}
.fld input[type=text],.fld select,.fld textarea{width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);resize:vertical}
.fld textarea{line-height:1.6}

.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:600px){.cols{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:10px;min-width:0;padding:14px;border:1px solid var(--line);border-radius:12px}
.res{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.res li{display:flex;align-items:flex-start;gap:8px;font-size:.93rem}
.res li.ok{color:var(--fg)}.res li.ok svg{color:var(--ok)}

.who-b b{flex:1;min-width:0;overflow-wrap:anywhere}

#lb:not(:empty){position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;padding:16px}

.th .ld{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:.78rem;text-align:center;padding:4px}
.meta{display:block;font-weight:400;color:var(--muted);font-size:.82rem;line-height:1.35;margin-top:2px}
.dmg{min-height:40px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-weight:600;font-size:.85rem;color:var(--muted);flex:none}

.vh{position:absolute;opacity:0;width:1px;height:1px}
.kit-a{flex-wrap:wrap;gap:8px}.kit-a .btn{flex:1 1 120px}
.kit-img{display:block;width:100%;aspect-ratio:16/10;padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface2)}
.kit-img img{width:100%;height:100%;object-fit:cover;display:block}
.ithumb{width:46px;height:46px;flex:none;padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface2);display:grid;place-items:center;color:var(--muted);cursor:pointer}
.ithumb img{width:100%;height:100%;object-fit:cover;display:block}
.ithumb.big{width:64px;height:64px}
.irow{display:flex;flex-direction:column;gap:8px;padding:10px;border:1px solid var(--line);border-radius:10px}

.irow-g{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.irow-t input[type=text]{flex:1}
.kv-img{width:100%;max-height:240px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
#print{display:none}
.pf{font:12px/1.45 var(--font);color:#000;background:#fff}
.pf h1{font-size:18px;text-align:center;margin:0 0 2px}
.pf-sub{text-align:center;color:#444;margin-bottom:8px;font-size:11px}
.pf table{width:100%;border-collapse:collapse}
.pf-m td{padding:3px 6px;border:1px solid #000}
.pf-m td:nth-child(odd){background:#eee;width:16%;font-weight:600}
.pf-t{margin-top:8px}

@media print{@page{size:A4;margin:12mm}html,body{background:#fff!important}body>*:not(#print){display:none!important}#print{display:block!important}}

   +'<section class="sect"><h2>สำรองและย้ายข้อมูล</h2><p class="hint">ดาวน์โหลดไฟล์สำรองไว้เป็นระยะ หรือใช้ย้ายข้อมูลโหมดเครื่องเดียวขึ้น Firebase (ตั้งค่า Firebase ก่อน แล้วนำเข้าไฟล์ที่นี่)</p><div class="pbtns"><button class="btn" data-act="xlsx" data-w="kits">'+ic('sheet')+'ส่งออกรายการอุปกรณ์ (Excel)</button><button class="btn" data-act="export">ดาวน์โหลดไฟล์สำรอง</button><label class="btn" for="imp">นำเข้าไฟล์สำรอง</label><input id="imp" type="file" accept="application/json,.json" data-import="1"></div></section>';

/* ---------- sheets ---------- */
function closeSheet(){
  var f=S.sheet;
  if(f&&f.type==='flow'&&!f.done&&S.assets){f.photos.forEach(function(p){if(p.id)S.assets.delete(p.id).catch(function(){})})}
  S.sheet=null;renderSheet();
}
function shell(f,title,body,foot){
  return '<div class="ov" data-act="ovclick"><div class="sheet" role="dialog" aria-modal="true" aria-label="'+esc(title)+'" tabindex="-1"><div class="sh-head"><h2>'+esc(title)+'</h2>'+(f.forced?'':'<button class="ic-btn" data-act="close" aria-label="ปิด">'+ic('x')+'</button>')+'</div><div class="sh-body">'+body+'</div>'+(foot?'<div class="sh-foot">'+foot+'</div>':'')+'</div></div>';
}
function renderSheet(){
  var host=$('#sheet'),f=S.sheet;
  if(!f){host.innerHTML='';document.body.style.overflow='';return}
  var old=host.querySelector('.sh-body'),st=old?old.scrollTop:0,ae=document.activeElement;
  var aid=ae&&host.contains(ae)?ae.id:null,ss=ae&&typeof ae.selectionStart==='number'?[ae.selectionStart,ae.selectionEnd]:null;
  host.innerHTML=sheetHTML(f);
  var nb=host.querySelector('.sh-body');
  if(nb&&old)nb.scrollTop=st;
  if(aid){var el=document.getElementById(aid);if(el){el.focus({preventScroll:true});if(ss&&el.setSelectionRange){try{el.setSelectionRange(ss[0],ss[1])}catch(e){}}}}
  else if(!old){var d=host.querySelector('.sheet');if(d)d.focus({preventScroll:true})}
  if(!aid&&f.type==='who'&&f.step==='pin'){var pi=document.getElementById('pin-in');if(pi)pi.focus({preventScroll:true})}
  document.body.style.overflow='hidden';
}
function sheetHTML(f){
  if(f.type==='who')return whoHTML(f);
  if(f.type==='flow')return flowHTML(f);
  if(f.type==='detail')return detailHTML(f);
  if(f.type==='kit')return kitFormHTML(f);
  if(f.type==='kitview')return kitViewHTML(f);
  if(f.type==='mem')return memFormHTML(f);
  return '';
}
function whoHTML(f){
  var m=f.step==='pin'?S.members.find(function(x){return x.id===f.mid}):null;
  if(f.step==='pin'&&m){
    var setup=f.mode==='setup';
    var body='<p class="muted">'+(setup?'ครั้งแรก ตั้งรหัสของ <b>'+esc(m.name)+'</b> (ตัวเลข 4-6 หลัก) หลังจากนี้มีเพียงหัวหน้าที่เปลี่ยนรหัสได้':'ใส่รหัสของ <b>'+esc(m.name)+'</b>')+'</p>'
     +'<div class="fld"><label for="pin-in">รหัส</label><input id="pin-in" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="'+(setup?'new-password':'current-password')+'" maxlength="6" data-bind="pin" data-enter="pinok" value="'+esc(f.form.pin)+'"></div>'
     +(setup?'<div class="fld"><label for="pin-in2">ยืนยันรหัสอีกครั้ง</label><input id="pin-in2" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="new-password" maxlength="6" data-bind="pin2" data-enter="pinok" value="'+esc(f.form.pin2)+'"></div>':'')
     +(f.err?'<p class="note err">'+esc(f.err)+'</p>':'');
    var foot='<button class="btn" data-act="pinback"'+(f.busy?' disabled':'')+'>กลับ</button><button class="btn pri" data-act="pinok"'+(f.busy?' disabled':'')+'>'+(setup?'ตั้งรหัสและเข้าใช้งาน':'เข้าสู่ระบบ')+'</button>';
    return shell(f,setup?'ตั้งรหัสครั้งแรก':'ใส่รหัส',body,foot);
  }
  var b=S.members.length?'<div class="list">'+S.members.map(function(x){return '<button class="who-b '+(S.me&&S.me.id===x.id?'on':'')+'" data-act="pick" data-id="'+x.id+'"><b>'+esc(x.name)+'</b>'+(x.pw?'':'<span class="pill badp">ยังไม่มีรหัส</span>')+'<span class="pill role">'+(ROLE[x.role]||'')+'</span></button>'}).join('')+'</div>':'<p class="muted">ยังไม่มีรายชื่อทีม ให้หัวหน้าเพิ่มในแท็บจัดการ</p>';
  var foot2=S.me?'<button class="btn" data-act="logout">ออกจากระบบ</button>':'';
  return shell(f,'เข้าสู่ระบบ','<p class="muted">เลือกชื่อของคุณ แล้วใส่รหัส ระบบจะบันทึกชื่อนี้ในรายการยืมและคืน</p>'+(f.err?'<p class="note err">'+esc(f.err)+'</p>':'')+b,foot2);
}
function flowHTML(f){
  var n=f.items.length,c=f.items.filter(function(i){return f.checks[i.id]}).length,ret=f.mode!=='borrow',cf=f.mode==='confirm',L=f.loan;
  var sum='<dl class="sum"><dt>กล่อง</dt><dd><b>'+esc(f.kit.name)+'</b> <span class="code">'+esc(f.kit.code||'')+'</span></dd>'
   +(ret?'<dt>ยืมโดย</dt><dd>'+esc(L.borrowerName)+' · '+fmt(L.borrowAt)+'</dd>'+(cf?'<dt>คืนโดย</dt><dd>'+esc(L.returnByName)+' · '+fmt(L.returnAt)+'</dd><dt>ยืนยันโดย</dt><dd>'+esc(S.me.name)+'</dd>':'<dt>คืนโดย</dt><dd>'+esc(S.me.name)+'</dd>'):'<dt>ผู้ยืม</dt><dd>'+esc(S.me.name)+'</dd>')+'</dl>';
  var chk='<section><div class="sec-h"><h3>'+(cf?'ตรวจของที่ได้รับคืน':ret?'ตรวจของที่คืน':'ตรวจของที่รับไป')+' <span class="muted">'+c+'/'+n+'</span></h3><button class="btn sm" data-act="tickall">'+(c===n?'ยกเลิกติ๊กทั้งหมด':'ติ๊กครบทั้งหมด')+'</button></div>'

      var on=!!f.checks[it.id],was=ret&&L.borrowChecks&&L.borrowChecks[it.id]===false,wasBad=ret&&L.borrowCond&&L.borrowCond[it.id],mt=itemMeta(it);

    }).join('')+'</div></section>';

   +'<label class="btn" for="ph-pick">'+ic('image')+'เลือกจากเครื่อง</label><input id="ph-pick" type="file" accept="image/*" multiple data-photo="1"></div>'
   +(f.photos.length?'<div class="phs">'+f.photos.map(function(p){
      return '<div class="th"><img src="'+esc(p.prev)+'" alt="รูปที่แนบ">'+(p.state==='up'?'<div class="st">กำลังอัปโหลด</div>':p.state==='err'?'<div class="st" style="background:var(--bad)">ไม่สำเร็จ</div>':'')+'<button class="rm" data-act="rmph" data-key="'+p.key+'" aria-label="ลบรูป">'+ic('x')+'</button></div>';
    }).join('')+'</div>':'<p class="hint">ถ่ายรูปกล่องและเครื่องมือ'+(ret?'ตอนคืน':'ก่อนรับไป')+' ไว้เป็นหลักฐาน (ไม่บังคับ)</p>')

  var nt='<div class="fld"><label for="f-note">หมายเหตุ</label><textarea id="f-note" rows="3" data-bind="note" placeholder="เช่น ไขควงด้ามแตก ใช้งานได้ปกติ">'+esc(f.form.note)+'</textarea></div>';
  var upl=f.photos.some(function(p){return p.state==='up'});

  var who=C?l.confirmByName:R?l.returnByName:l.borrowerName,when=C?l.confirmAt:R?l.returnAt:l.borrowAt,wait=(R&&l.status==='out')||(C&&!l.confirmAt);

/* ---------- photos ---------- */
function loadImg(file){return new Promise(function(res,rej){var u=URL.createObjectURL(file),i=new Image();i.onload=function(){URL.revokeObjectURL(u);res(i)};i.onerror=function(){URL.revokeObjectURL(u);rej(new Error('img'))};i.src=u})}
async function shrink(file,max,q){
  var i=await loadImg(file),r=Math.min(1,max/Math.max(i.naturalWidth,i.naturalHeight)),w=Math.max(1,Math.round(i.naturalWidth*r)),h=Math.max(1,Math.round(i.naturalHeight*r));
  var c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(i,0,0,w,h);
  return new Promise(function(res,rej){c.toBlob(function(b){b?res(b):rej(new Error('blob'))},'image/jpeg',q)});
}
function toData(b){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result)};r.onerror=rej;r.readAsDataURL(b)})}
function addPhotos(files){
  var f=S.sheet;if(!f||f.type!=='flow')return;
  files.forEach(function(file){
    if(!file.type||file.type.indexOf('image/')!==0)return;
    if(f.photos.length>=3){toast('แนบรูปได้สูงสุด 3 รูปต่อครั้ง');return}
    var p={key:uid(),prev:URL.createObjectURL(file),state:'up',pid:'p'+uid(),d:null};
    f.photos.push(p);prepPhoto(p,file,f);
  });
  renderSheet();
}
async function prepPhoto(p,file,f){
  try{
    var b=await shrink(file,720,.55);
    if(b.size>110000)b=await shrink(file,560,.45);
    p.d=await toData(b);p.state='ok';
  }catch(e){p.state='err'}
  if(S.sheet===f)renderSheet();
}

async function doPin(){
  var f=S.sheet;if(!f||f.type!=='who'||f.busy||!S.db)return;
  var m=S.members.find(function(x){return x.id===f.mid});if(!m)return;
  var pin=String(f.form.pin||'');
  if(!/^\d{4,6}$/.test(pin)){f.err='รหัสต้องเป็นตัวเลข 4-6 หลัก';renderSheet();return}
  if(f.mode==='setup'){
    if(pin!==String(f.form.pin2||'')){f.err='รหัสสองช่องไม่ตรงกัน';renderSheet();return}
    f.busy=true;f.err=null;renderSheet();
    try{var salt=uid();await S.db.doc('members/'+m.id).update({pw:hashPin(m.id,pin,salt),salt:salt});loginOk(m)}
    catch(e){f.busy=false;f.err='บันทึกรหัสไม่สำเร็จ ลองอีกครั้ง';renderSheet()}
    return;
  }
  var lk=LOCK[m.id];
  if(lk&&lk.until>Date.now()){f.err='ใส่รหัสผิดหลายครั้ง รออีก '+Math.ceil((lk.until-Date.now())/1000)+' วินาที';renderSheet();return}
  if(hashPin(m.id,pin,m.salt||'')===m.pw){delete LOCK[m.id];loginOk(m);return}
  lk=LOCK[m.id]=lk||{n:0,until:0};lk.n++;
  if(lk.n>=5){lk.n=0;lk.until=Date.now()+30000;f.err='ใส่ผิด 5 ครั้ง รอ 30 วินาที'}else f.err='รหัสไม่ถูกต้อง';
  f.form.pin='';renderSheet();
}
function loginOk(m){sessSet(m.id);S.me=m;S.tab='kits';S.sheet=null;renderSheet();render();toast('สวัสดี '+m.name)}
function openWho(forced){S.sheet={type:'who',forced:!!forced,step:'pick',mode:'login',mid:null,form:{pin:'',pin2:''},err:null,busy:false};renderSheet()}
function openFlow(mode,kitId){
  if(S.ro)return;
  if(!S.me){openWho(false);toast('เลือกชื่อของคุณก่อน');return}
  var kit=S.kits.find(function(k){return k.id===kitId}),loan=null,items;
  if(mode==='return'||mode==='confirm'){
    loan=outMap()[kitId];
    if(!loan){toast('กล่องนี้ถูกคืนไปแล้ว');return}
    if(mode==='return'&&loan.status!=='out'){toast('คืนแล้ว รอหัวหน้ายืนยัน');return}
    if(mode==='confirm'&&(loan.status!=='pending'||!isMgr())){toast('ยืนยันได้เฉพาะหัวหน้า/รองหัวหน้า หลังมีการคืน');return}
    items=loan.items;
  }else{
    if(!kit)return;
    if(outMap()[kitId]){toast('กล่องนี้ถูกยืมไปแล้ว');return}
    items=kit.items||[];
  }
  if(!items.length){toast('กล่องนี้ยังไม่มีรายการ ให้หัวหน้าเพิ่มก่อน');return}
  S.sheet={type:'flow',mode:mode,kit:kit?{id:kit.id,name:kit.name,code:kit.code}:{id:loan.kitId,name:loan.kitName,code:loan.kitCode},loan:loan,
    items:items.map(function(i){return {id:i.id,n:i.n,b:i.b||'',s:i.s||'',r:i.r||'',q:i.q||'',ph:(loan?itemPh(loan,i):i.ph)||''}}),checks:mode==='confirm'?Object.assign({},loan.returnChecks):{},bad:mode==='confirm'?Object.assign({},loan.returnCond):{},photos:[],form:{note:'',approver:''},busy:false,err:null,done:false};
  renderSheet();
}
async function submitFlow(){
  var f=S.sheet;if(!f||f.type!=='flow'||f.busy)return;
  if(f.photos.some(function(p){return p.state==='up'}))return;
  var db=S.db;if(!db){f.err='ยังไม่ได้เชื่อมต่อที่เก็บข้อมูล';renderSheet();return}
  f.busy=true;f.err=null;renderSheet();
  var checks={},miss=[],cond={},badNames=[];
  f.items.forEach(function(i){var ok=!!f.checks[i.id];checks[i.id]=ok;if(!ok)miss.push(i.n);else if(f.bad[i.id]){cond[i.id]=true;badNames.push(i.n)}});
  var apm=S.members.find(function(m){return m.id===f.form.approver}),apn=apm?apm.name:'';
  var okp=f.photos.filter(function(p){return p.state==='ok'}),photos=okp.map(function(p){return {id:p.pid}});
  var note=String(f.form.note||'').trim(),now=new Date().toISOString();
  try{
    await Promise.all(okp.map(function(p){return db.doc('photos/'+p.pid).set({d:p.d,at:now})}));
    if(f.mode==='borrow'){
      var q=await db.collection('loans').where('kitId','==',f.kit.id).get();
      if(q.docs.some(function(d){var st=d.data().status;return st==='out'||st==='pending'}))throw new Error('กล่องนี้เพิ่งถูกยืมไปแล้ว');
      await db.collection('loans').doc(uid()).set({kitId:f.kit.id,kitName:f.kit.name,kitCode:f.kit.code||'',borrowerId:S.me.id,borrowerName:S.me.name,byUid:S.uid||null,
        status:'out',borrowAt:now,items:f.items,borrowChecks:checks,borrowMissing:miss,borrowPhotos:photos,borrowNote:note,borrowCond:cond,borrowBadNames:badNames,borrowApprover:apn});
    }else if(f.mode==='confirm'){
      var cc=await db.doc('loans/'+f.loan.id).get();
      if(!cc.exists||cc.data().status!=='pending')throw new Error('รายการนี้ไม่ได้รอการยืนยัน');
      await db.doc('loans/'+f.loan.id).update({status:'returned',confirmAt:now,confirmById:S.me.id,confirmByName:S.me.name,confirmChecks:checks,confirmMissing:miss,confirmPhotos:photos,confirmNote:note,confirmCond:cond,confirmBadNames:badNames});
    }else{
      var cur=await db.doc('loans/'+f.loan.id).get();
      if(!cur.exists||cur.data().status!=='out')throw new Error('รายการนี้ถูกคืนไปแล้ว');
      await db.doc('loans/'+f.loan.id).update({status:'pending',returnAt:now,returnById:S.me.id,returnByName:S.me.name,returnChecks:checks,returnMissing:miss,returnPhotos:photos,returnNote:note,returnCond:cond,returnBadNames:badNames,returnApprover:apn});
    }
    f.done=true;S.sheet=null;renderSheet();
    toast(f.mode==='borrow'?'บันทึกการยืมแล้ว':f.mode==='confirm'?'ยืนยันรับคืนแล้ว'+(miss.length?' (ขาด '+miss.length+' รายการ)':''):(miss.length?'บันทึกการคืนแล้ว (ขาด '+miss.length+' รายการ)':'ส่งคืนแล้ว รอหัวหน้ายืนยันรับ'));
  }catch(e){
    f.busy=false;f.err=(e&&e.message)||'บันทึกไม่สำเร็จ ลองอีกครั้ง';
    if(e&&e.code==='invalid_argument')f.err='บัญชีนี้ไม่มีสิทธิ์บันทึก ขอสิทธิ์แก้ไขจากเจ้าของแอพ';
    if(S.sheet===f)renderSheet();
  }
}

async function saveKit(){

async function setPhoto(kind,idx,file){

    var b=kind==='kit'?await shrink(file,640,.55):await shrink(file,480,.5);

async function delKit(){

/* ---------- local database (IndexedDB, same API shape as a document store) ---------- */
function makeLocalDB(){
  return new Promise(function(resolve){
    var mem={members:{},kits:{},loans:{},photos:{}},subs=[],idb=null,bc=null;
    try{bc=new BroadcastChannel('tool-loan-sync')}catch(e){}
    var clone=function(o){return JSON.parse(JSON.stringify(o))};
    function notify(){subs.slice().forEach(function(f){f()})}
    function put(col,id,data){mem[col]=mem[col]||{};if(data===null)delete mem[col][id];else mem[col][id]=data}
    function persist(col,id,data){
      if(bc){try{bc.postMessage({col:col,id:id,data:data})}catch(e){}}
      if(!idb)return Promise.resolve();
      return new Promise(function(res,rej){
        var tx=idb.transaction('docs','readwrite'),st=tx.objectStore('docs'),k=col+'/'+id;
        if(data===null)st.delete(k);else st.put(data,k);
        tx.oncomplete=function(){res()};tx.onerror=function(){rej(tx.error||new Error('idb'))};tx.onabort=tx.onerror;
      });
    }
    if(bc)bc.onmessage=function(e){var m=e.data;if(m&&m.col){put(m.col,m.id,m.data);notify()}};
    function snap(id,d){return {id:id,exists:d!==undefined,data:function(){return d===undefined?undefined:clone(d)}}}
    function docRef(path){
      var i=path.indexOf('/'),col=path.slice(0,i),id=path.slice(i+1);
      return {
        get:function(){return Promise.resolve(snap(id,(mem[col]||{})[id]))},
        set:function(data){var d=clone(data);return persist(col,id,d).then(function(){put(col,id,d);notify()})},
        update:function(data){var cur=(mem[col]||{})[id];if(!cur)return Promise.reject({code:'invalid_argument',message:'ไม่พบข้อมูลนี้'});var d=Object.assign(clone(cur),clone(data));return persist(col,id,d).then(function(){put(col,id,d);notify()})},
        delete:function(){return persist(col,id,null).then(function(){put(col,id,null);notify()})}
      };
    }
    function Q(col,w,ord,lim){
      var q={
        where:function(f,op,v){return Q(col,w.concat([[f,op,v]]),ord,lim)},
        orderBy:function(f,d){return Q(col,w,[f,d||'asc'],lim)},
        limit:function(n){return Q(col,w,ord,n)},
        doc:function(id){return docRef(col+'/'+id)},
        _run:function(){
          var rows=Object.keys(mem[col]||{}).map(function(id){return {id:id,d:mem[col][id]}});
          w.forEach(function(c){rows=rows.filter(function(r){var a=r.d[c[0]];return c[1]==='=='?a===c[2]:c[1]==='!='?a!==c[2]:true})});
          if(ord)rows.sort(function(a,b){var x=a.d[ord[0]],y=b.d[ord[0]],r=x<y?-1:x>y?1:0;return ord[1]==='desc'?-r:r});
          if(lim)rows=rows.slice(0,lim);
          var docs=rows.map(function(r){return snap(r.id,r.d)});
          return {docs:docs,size:docs.length,empty:!docs.length};
        },
        get:function(){return Promise.resolve(q._run())},
        onSnapshot:function(next){
          var on=true;function fire(){if(on)next(q._run())}
          subs.push(fire);setTimeout(fire,0);
          return function(){on=false;subs=subs.filter(function(f){return f!==fire})};
        }
      };
      return q;
    }
    function api(){
      return {
        collection:function(c){return Q(c,[],null,0)},
        doc:docRef,
        _export:function(){return clone(mem)},
        _import:async function(data){
          var n=0;
          for(var col in data){if(!mem.hasOwnProperty(col))continue;
            for(var id in data[col]){await docRef(col+'/'+id).set(data[col][id]);n++}}
          return n;
        }
      };
    }
    var req;
    try{req=indexedDB.open('tool-loan-db',1)}catch(e){S.volatile=true;resolve(api());return}
    req.onupgradeneeded=function(){req.result.createObjectStore('docs')};
    req.onerror=function(){S.volatile=true;resolve(api())};
    req.onsuccess=function(){
      idb=req.result;
      try{
        var tx=idb.transaction('docs','readonly'),st=tx.objectStore('docs'),keys=st.getAllKeys(),vals=st.getAll();
        tx.oncomplete=function(){
          keys.result.forEach(function(k,i){var j=String(k).indexOf('/');put(String(k).slice(0,j),String(k).slice(j+1),vals.result[i])});
          resolve(api());
        };
        tx.onerror=function(){S.volatile=true;idb=null;resolve(api())};
      }catch(e){S.volatile=true;idb=null;resolve(api())}
    };
  });
}

var RULES="rules_version = '2';\nservice cloud.firestore {\n  match /databases/{database}/documents {\n    match /{col}/{doc=**} {\n      allow read, write: if col.matches('toolloan_.*');\n    }\n  }\n}";
function parseCfg(t){
  var o={};
  ['apiKey','authDomain','projectId','storageBucket','messagingSenderId','appId'].forEach(function(k){
    var m=new RegExp('["\']?'+k+'["\']?\\s*:\\s*["\']([^"\']+)["\']').exec(t);if(m)o[k]=m[1];
  });
  return (o.apiKey&&o.projectId)?o:null;
}
function fbMsg(e){
  var c=e&&e.code;
  if(c==='nofb')return 'โหลด Firebase ไม่ได้ ตรวจอินเทอร์เน็ตแล้วเปิดไฟล์ใหม่';
  if(c==='permission-denied'||c==='failed-precondition')return 'Firebase ไม่อนุญาต ตรวจว่าสร้าง Firestore Database แล้ว และวาง Rules ตามข้อ 3 แล้วกด Publish';
  if(c==='timeout'||c==='unavailable')return 'เชื่อม Firestore ไม่ได้ สาเหตุที่พบบ่อยคือยังไม่ได้สร้าง Firestore Database (Firebase Console > Build > Firestore Database > Create database) หรืออินเทอร์เน็ต/เครือข่ายบล็อก Google';
  return 'เชื่อมต่อไม่สำเร็จ ('+(c||'error')+') ตรวจค่า config อีกครั้ง';
}
function prefixed(db){var P='toolloan_';return {collection:function(c){return db.collection(P+c)},doc:function(p){return db.doc(P+p)}}}
function fbDB(cfg){
  if(!window.firebase)throw {code:'nofb'};
  var db=firebase.initializeApp(cfg,'app'+Date.now()).firestore();
  try{db.settings({experimentalAutoDetectLongPolling:true})}catch(e){}
  return db;
}

async function doConnect(){
  var ta=$('#cfg-in');S.cfgText=ta?ta.value:S.cfgText;
  var cfg=parseCfg(S.cfgText);
  if(!cfg){S.smsg='อ่านค่า config ไม่ได้ ต้องมี apiKey และ projectId ให้คัดลอกทั้งก้อนจาก Firebase';render();return}
  S.cbusy=true;S.smsg='';render();
  try{
    var db=prefixed(fbDB(cfg));
    await Promise.race([db.collection('members').get(),new Promise(function(_,rej){setTimeout(function(){rej({code:'timeout'})},12000)})]);
    lsSet(CFG_KEY,JSON.stringify(cfg));lsSet(MODE_KEY,'cloud');S.cbusy=false;attach(db,'cloud');
  }catch(e){S.cbusy=false;S.smsg=fbMsg(e);render()}
}
async function useLocal(){
  S.cbusy=true;render();
  var db=null;try{db=await makeLocalDB()}catch(e){}
  S.cbusy=false;
  if(!db){S.smsg='เบราว์เซอร์นี้ไม่รองรับการเก็บข้อมูลในเครื่อง';render();return}
  lsSet(MODE_KEY,'local');attach(db,'local');
}
function reconf(){try{localStorage.removeItem(CFG_KEY);localStorage.removeItem(MODE_KEY)}catch(e){}location.reload()}

async function boot(){
  render();
  var cfg=FIREBASE_CONFIG;
  if(!cfg){try{cfg=JSON.parse(lsGet(CFG_KEY)||'null')}catch(e){}}
  if(cfg){try{attach(prefixed(fbDB(cfg)),'cloud')}catch(e){S.setup=true;S.smsg=fbMsg(e);render()}return}
  if(lsGet(MODE_KEY)==='local'){
    var db=null;try{db=await makeLocalDB()}catch(e){}
    if(!db){S.nodb=true;render();return}
    attach(db,'local');return;
  }
  S.setup=true;render();
}
function attach(db,mode){
  S.db=db;S.mode=mode;S.setup=false;S.err=null;S.ld={m:0,k:0,l:0};
  setTimeout(function(){
    if(S.ld.k&&S.ld.m&&S.ld.l)return;
    S.slow=true;render();
    if(mode!=='cloud')return;
    Promise.race([db.collection('members').get({source:'server'}),new Promise(function(_,rej){setTimeout(function(){rej({code:'timeout'})},8000)})])
      .then(function(){}).catch(function(e){if(!(S.ld.k&&S.ld.m&&S.ld.l)){S.diag=fbMsg(e);render()}});
  },8000);
  render();
  var onErr=function(er){var c=er&&er.code;S.err=c==='permission-denied'?'Firebase ไม่อนุญาต ตรวจ Rules ของ Firestore':(c||'error');render()};
  db.collection('members').onSnapshot(function(s){
    S.members=s.docs.map(function(d){var x=d.data();x.id=d.id;return x}).sort(function(a,b){return (a.order||0)-(b.order||0)});S.ld.m=1;onData();
  },onErr);
  db.collection('kits').onSnapshot(function(s){
    S.kits=s.docs.map(function(d){var x=d.data();x.id=d.id;return x}).sort(function(a,b){return ((a.order==null?999:a.order)-(b.order==null?999:b.order))||String(a.code||a.name).localeCompare(String(b.code||b.name),'th',{numeric:true})});S.ld.k=1;onData();
  },onErr);
  db.collection('loans').orderBy('borrowAt','desc').limit(500).onSnapshot(function(s){
    S.loans=s.docs.map(function(d){var x=d.data();x.id=d.id;return x});S.ld.l=1;onData();
  },onErr);
}
boot();
